<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>记事本</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font: 14px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
            "Microsoft YaHei", sans-serif;
      color: #1d2126;
      background: #f4f5f6;
    }
    .card {
      width: min(360px, 86vw);
      padding: 28px 26px;
      text-align: center;
      background: #fff;
      border: 1px solid #e7e9ec;
      border-radius: 14px;
      box-shadow: 0 6px 24px -12px rgba(24, 28, 33, .22);
    }
    h1 { margin: 0 0 6px; font-size: 17px; }
    p { margin: 0 0 18px; color: #565d67; font-size: 13px; }
    a {
      display: inline-block;
      padding: 9px 18px;
      color: #fff;
      background: #23272e;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 560;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>记事本</h1>
    <p>应用已在后台运行，点击下面的按钮打开。</p>
    <a id="open" href="#">打开记事本</a>
  </div>
  <script>
    // 应用是一个独立端口的服务，这里拼出同主机的访问地址。
    var url = location.protocol + '//' + location.hostname + ':18180/';
    document.getElementById('open').href = url;
    setTimeout(function () { location.replace(url); }, 600);
  </script>
</body>
</html>
